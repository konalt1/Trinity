<title>ДПС героев Trinity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: balance worksheet — controls column beside live results, then the per-level ladder, then editable KV. */
:root {
  --bg: #f3f4f2;
  --panel: #fbfbfa;
  --line: #d9dbd6;
  --ink: #16191a;
  --ink-2: #4c5352;
  --ink-3: #7b8280;
  --accent: #9a3b1e;        /* rust red, used for controls only */
  --accent-ink: #ffffff;
  --accent-soft: #f1e3dc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
  --grid: #e6e7e3;
  --f-display: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141716; --panel: #1b1f1e; --line: #2f3533; --ink: #eef0ee; --ink-2: #b7bdba; --ink-3: #868d8a;
    --accent: #e08a62; --accent-ink: #1a0f0a; --accent-soft: #3a2a22;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --grid: #262b29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141716; --panel: #1b1f1e; --line: #2f3533; --ink: #eef0ee; --ink-2: #b7bdba; --ink-3: #868d8a;
  --accent: #e08a62; --accent-ink: #1a0f0a; --accent-soft: #3a2a22;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --grid: #262b29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.wrap > *, .stack > *, .calc > *, .headline > * { min-width: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.1; }
h2 { font-size: 21px; }
h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 500; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; color: var(--ink-3); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
header { display: grid; gap: 8px; }
header p { max-width: 72ch; color: var(--ink-2); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.calc { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .calc { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
label { font-size: 12.5px; color: var(--ink-2); }
input[type=number], input[type=text], select {
  font: inherit; font-family: var(--f-mono); font-size: 13px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; width: 100%; min-width: 0;
}
input:focus-visible, button:focus-visible, .pip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.lvl { display: flex; align-items: baseline; justify-content: space-between; }
.lvl .big { font-family: var(--f-display); font-size: 34px; line-height: 1; }
.skills { display: grid; gap: 8px; }
.skill { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.key { font-family: var(--f-display); font-size: 17px; text-align: center; color: var(--ink-2); }
.sname { font-weight: 500; }
.sname small { display: block; color: var(--ink-3); font-weight: 400; font-size: 11.5px; }
.pips { display: flex; gap: 4px; align-items: center; }
.pip { width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--ink-3); background: transparent; cursor: pointer; padding: 0; }
.pip.on { background: var(--accent); border-color: var(--accent); }
.pip:disabled { opacity: .3; cursor: not-allowed; }
.btn { font: inherit; font-size: 13px; font-weight: 500; border-radius: 4px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.linkbtn { font: inherit; font-size: 12px; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.kvrow code.nokv { opacity: .55; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.06); }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink); cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--ink-2); padding: 6px 10px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.points { font-size: 12.5px; color: var(--ink-2); }
.points b { color: var(--ink); font-family: var(--f-mono); }

.headline { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.metric { padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); display: grid; gap: 2px; }
.metric .v { font-family: var(--f-display); font-size: 40px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.metric .l { font-size: 12.5px; color: var(--ink-2); }
.metric .sub { font-size: 12px; color: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px 16px; }
.stat .l { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font-family: var(--f-mono); font-size: 15px; }
.breakdown { display: grid; gap: 10px; }
.bar { display: flex; height: 14px; gap: 2px; border-radius: 3px; overflow: hidden; background: var(--grid); }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: hidden; }
.chart text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink-3); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; font-size: 12px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; z-index: 2; }
.tip b { font-family: var(--f-mono); font-weight: 500; }
.castlog { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); line-height: 1.7; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--ink-2); font-size: 12px; background: var(--bg); position: sticky; top: 0; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr.cur { box-shadow: inset 3px 0 0 var(--accent); background: var(--accent-soft); }
td.num { font-family: var(--f-mono); }
td.strong { font-weight: 600; color: var(--ink); }
.build { font-family: var(--f-mono); letter-spacing: .02em; }
.sectionhead { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.kvgroup { display: grid; gap: 8px; align-content: start; }
.kvrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 150px); gap: 8px; align-items: center; }
.kvrow label code { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); display: block; overflow-wrap: anywhere; }
.kvrow input.changed { border-color: var(--accent); background: var(--accent-soft); }
nav.crumbs { font-size: 13px; }
nav.crumbs a { color: var(--accent); }
.notes { display: grid; gap: 6px; max-width: 80ch; color: var(--ink-2); font-size: 13px; padding-left: 18px; margin: 0; }
@media (max-width: 520px) { .headline { grid-template-columns: minmax(0,1fr); } .grid3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.vanhead { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; }
.vanhead .vs { display: grid; gap: 2px; }
.vanhead .vs .l { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.vanhead .vs .v { font-family: var(--f-mono); font-size: 24px; color: var(--ink); }
.vanhead .verdict .v { font-family: inherit; font-size: 18px; color: var(--ink-2); }
.vandetails summary { cursor: pointer; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
</style>

<style>
.ctrl { display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
.ctrl .field { min-width: 220px; flex: 1 1 220px; max-width: 420px; }
.rank { display: grid; gap: 4px; }
.rk { display: grid; grid-template-columns: 22px minmax(110px, 160px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
.rk:hover { background: var(--accent-soft); }
.rk.sel .nm { font-weight: 600; }
.rk .pos { font-family: var(--f-mono); color: var(--ink-3); font-size: 12px; text-align: right; }
.rk .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .nm a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--ink-3); }
.rk .trk { height: 12px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.rk .trk span { display: block; height: 100%; background: var(--ink-3); border-radius: 0 3px 3px 0; }
.rk.sel .trk span { background: var(--c, var(--accent)); }
.rk .vl { font-family: var(--f-mono); font-size: 13px; text-align: right; }
.rk .bd { grid-column: 2 / -1; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); margin-top: -4px; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }
.hl { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; }
.hl a { display: block; padding: 6px; border: 1px solid var(--grid); border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; }
.hl a:hover { background: var(--accent-soft); }
.hl a img { display: block; width: 100%; height: 84px; object-fit: cover; object-position: center 14%; border-radius: 4px; background: #111; }
.hl a small { display: block; color: var(--ink-3); font-family: var(--f-mono); font-size: 11px; margin-top: 6px; text-align: center; }
td a { color: var(--ink); }
</style>
<div id="app"></div>
<template id="tplSummary">
<div class="wrap">
  <header>
    <h1>ДПС героев Trinity</h1>
    <p>Максимальный урон в секунду по одной цели на каждом уровне героя: лучшая прокачка, все способности по кулдауну, атаки без перерыва. Цель — броня 5, маг. сопротивление 25%. Без предметов, Аганима и талантов; мана учитывается только у Tinker (с Arcane Boots). Числа из KV и Lua Trinity от 8 октября 2026. Клик по портрету героя открывает его калькулятор.</p>
  </header>

  <section class="panel stack" aria-label="Страницы героев">
    <h2>Страницы героев</h2>
    <p class="small">Калькулятор на каждого героя: прокачка способностей, параметры и редактируемые значения из KV.</p>
    <div class="hl"><a href="#juggernaut" title="Juggernaut"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/juggernaut.png" alt="Juggernaut"><small>279 ДПС на 18 ур.</small></a><a href="#lion" title="Lion"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/lion.png" alt="Lion"><small>195 ДПС на 18 ур.</small></a><a href="#lich" title="Lich"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/lich.png" alt="Lich"><small>329 ДПС на 18 ур.</small></a><a href="#nevermore" title="Shadow Fiend"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/nevermore.png" alt="Shadow Fiend"><small>268 ДПС на 18 ур.</small></a><a href="#omniknight" title="Omniknight"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/omniknight.png" alt="Omniknight"><small>313 ДПС на 18 ур.</small></a><a href="#phantom_assassin" title="Phantom Assassin"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/phantom_assassin.png" alt="Phantom Assassin"><small>325 ДПС на 18 ур.</small></a><a href="#pudge" title="Pudge"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png" alt="Pudge"><small>256 ДПС на 18 ур.</small></a><a href="#silencer" title="Silencer"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/silencer.png" alt="Silencer"><small>272 ДПС на 18 ур.</small></a><a href="#techies" title="Techies"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/techies.png" alt="Techies"><small>211 ДПС на 18 ур.</small></a><a href="#tinker" title="Tinker"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/tinker.png" alt="Tinker"><small>282 ДПС на 18 ур.</small></a><a href="#weaver" title="Weaver"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/weaver.png" alt="Weaver"><small>311 ДПС на 18 ур.</small></a><a href="#doom_bringer" title="Doom"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/doom_bringer.png" alt="Doom"><small>306 ДПС на 18 ур.</small></a><a href="#ember_spirit" title="Ember Spirit"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/ember_spirit.png" alt="Ember Spirit"><small>261 ДПС на 18 ур.</small></a><a href="#ogre_magi" title="Ogre Magi"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/ogre_magi.png" alt="Ogre Magi"><small>305 ДПС на 18 ур.</small></a><a href="#dawnbreaker" title="Dawnbreaker"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/dawnbreaker.png" alt="Dawnbreaker"><small>236 ДПС на 18 ур.</small></a><a href="#largo" title="Largo"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/largo.png" alt="Largo"><small>175 ДПС на 18 ур.</small></a><a href="#chen" title="Chen"><img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/chen.png" alt="Chen"><small>578 ДПС на 18 ур.</small></a></div>
  </section>

  <section class="panel stack" aria-label="График">
    <div class="ctrl">
      <div class="seg" role="group" aria-label="Окно">
        <button type="button" id="mFight" aria-pressed="true">Бой, 60 с</button>
        <button type="button" id="mBurst" aria-pressed="false">Бёрст, 5 с</button>
      </div>
      <div class="field">
        <div class="lvl"><label for="lvl">Уровень для рейтинга</label><span class="big num" id="lvlOut" style="font-size:26px">18</span></div>
        <input type="range" id="lvl" min="1" max="30" value="18">
      </div>
      <label class="toggle"><input type="checkbox" id="noChen"> Убрать Чена из графика</label>
    </div>
    <div class="two">
      <div class="stack" style="gap:8px">
        <div class="chart" id="lines"></div>
        <p class="small">Цветом выделены выбранные герои, остальные серые. Клик по герою в рейтинге добавляет или убирает его из выделения.</p>
      </div>
      <div class="stack" style="gap:8px">
        <h3 id="rankTitle">Рейтинг на 18 уровне</h3>
        <div class="rank" id="rank"></div>
      </div>
    </div>
  </section>

  <section class="panel stack" aria-label="Таблица">
    <h2>ДПС по уровням</h2>
    <div class="tablewrap"><table id="tbl"><thead><tr id="th"></tr></thead><tbody></tbody></table></div>
  </section>

  <section class="stack" aria-label="Допущения">
    <h3>Что важно знать</h3>
    <ul class="notes">
      <li>Chen считается с 4 подчинёнными крипами у цели (не больше лимита Holy Persuasion на уровне) и, с ультой, по 4 охотника и 4 громилы из барака. Драконы и взрыв охотников не считаются. Всё меняется ползунками на его странице.</li>
      <li>Tinker под Rearm 15 секунд кастует способности с КД 3/2,5/2 с. Мана учитывается: Tinker носит Arcane Boots и жмёт их под Rearm на каждом откате.</li>
      <li>Стакающиеся механики взяты по максимуму или с типичным запасом: 20 душ SF, 10 убийств у Lion и Pudge, 20 поглощений у Doom. Всё меняется ползунками на страницах героев.</li>
      <li>Ogre Magi берёт из Reroll самую сильную по одной цели ульту (Finger of Death). У Largo калькулятор сам выбирает, что делать между заклинаниями: атаки, Fight Song или прыжки.</li>
      <li>Omniknight в рейтинге с хаммером на 50%: в заряд третьего скилла идёт половина хила, остальное не восстанавливает здоровье.</li>
    </ul>
  </section>
</div>
</template>

<script>
// Trinity DPS engine v2 — event-driven single-target damage simulation shared by all hero pages.
(function (root) {
  'use strict';
  const EPS = 1e-9;
  function armorMult(a) { return 1 - (0.06 * a) / (1 + 0.06 * Math.abs(a)); }
  function pick(v, rank) {
    if (Array.isArray(v)) return v[Math.max(0, Math.min(rank, v.length) - 1)];
    return v;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // Binary heap of events ordered by time then insertion order.
  function Heap() { this.a = []; this.seq = 0; }
  Heap.prototype.push = function (time, fn) {
    const a = this.a, e = { time, seq: this.seq++, fn };
    a.push(e); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (less(a[i], a[p])) { [a[i], a[p]] = [a[p], a[i]]; i = p; } else break; }
  };
  Heap.prototype.peek = function () { return this.a[0]; };
  Heap.prototype.pop = function () {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) { a[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < a.length && less(a[l], a[m])) m = l; if (r < a.length && less(a[r], a[m])) m = r; if (m === i) break; [a[i], a[m]] = [a[m], a[i]]; i = m; } }
    return top;
  };
  function less(x, y) { return x.time < y.time - EPS || (Math.abs(x.time - y.time) <= EPS && x.seq < y.seq); }

  function maxRank(level, skill) {
    if (skill.fixedRank) return skill.fixedRank;
    if (skill.ult) return Math.min(skill.max, Math.floor(level / 6));
    return Math.min(skill.max, Math.floor((level + 1) / 2));
  }
  function learnable(def) { return def.skills.filter(s => !s.extra); }

  // ---------------------------------------------------------------------------
  function simulate(def, cfg, level, ranks, opts) {
    const W = opts.window;
    const H = cfg.hero;
    const bonus = opts.bonus || {};
    const P = {};
    for (const pd of def.params || []) P[pd.id] = pd.def;
    Object.assign(P, opts.params || {});
    const out = { total: 0, by: {}, casts: [], events: [], attacks: 0, window: W };
    const heap = new Heap();
    const hb = new Map(); // hero buffs: id -> {until, p}
    const td = new Map(); // target debuffs
    const cd = {}, charges = {};
    const S = {}; // hero-specific scratch state
    let t = 0, busyUntil = 0, disarmUntil = 0, silenceUntil = 0, atkReady = 0;
    let noAttack = false, fillerReady = 0;

    const skills = def.skills.filter(s => !s.extra || (s.scepter ? opts.scepter : true));
    const rankOf = s => s.extra ? (s.rankFrom ? (ranks[s.rankFrom] || 0) : (s.fixedRank || 1)) : (ranks[s.k] || 0);
    const vals = k => cfg.skills[k] || {};

    const ctx = {
      def, cfg, level, opts, P, S, out,
      get t() { return t; },
      W,
      rank: k => { const s = def.skills.find(x => x.k === k); return s ? rankOf(s) : 0; },
      v: (k, key, rank) => pick(vals(k)[key], rank == null ? ctx.rank(k) : rank),
      at: (time, fn) => { if (time <= W + EPS) heap.push(Math.max(time, t), fn); },
      buff: (id, dur, p) => { hb.set(id, { until: t + dur, p: p || {} }); },
      buffUntil: (id, until, p) => { hb.set(id, { until, p: p || {} }); },
      hasBuff: id => { const b = hb.get(id); return !!b && b.until > t + EPS; },
      buffP: id => { const b = hb.get(id); return b && b.until > t + EPS ? b.p : null; },
      debuff: (id, dur, p) => { td.set(id, { until: t + dur, p: p || {} }); },
      hasDebuff: id => { const b = td.get(id); return !!b && b.until > t + EPS; },
      debuffP: id => { const b = td.get(id); return b && b.until > t + EPS ? b.p : null; },
      targetSilenced: () => { for (const b of td.values()) if (b.until > t + EPS && b.p.silence) return true; return false; },
      busy: until => { busyUntil = Math.max(busyUntil, until); },
      disarm: until => { disarmUntil = Math.max(disarmUntil, until); },
      selfSilence: until => { silenceUntil = Math.max(silenceUntil, until); },
      setCd: (k, time) => { cd[k] = time; },
      chargesLeft: k => (charges[k] ? charges[k].n : 0),
      cdReady: k => cd[k] == null ? 0 : cd[k],
      mana: () => (MN ? manaNow() : Infinity),
      manaMax: () => (MN ? mMax() : Infinity),
      addMana: v => { if (MN) { manaNow(); mCur = Math.min(mMax(), mCur + v); mGain += v; } },
      canAfford: k => { const s = def.skills.find(x => x.k === k); return s ? canAffordS(s) : true; },
      resetCooldowns: (except, skipItems) => { for (const s of skills) if (s.k !== except && !(skipItems && s.item)) { cd[s.k] = t; if (charges[s.k]) charges[s.k].n = charges[s.k].max; } },
      cast: (label) => out.casts.push({ t, a: label }),
      str, agi, int, mp, attackDamage, attackSpeed,
      deal, heroAttack, unitAttacks,
    };

    function sumBuff(prop) { let s = 0; for (const b of hb.values()) if (b.until > t + EPS && b.p[prop]) s += b.p[prop]; return s; }
    function sumDebuff(prop) { let s = 0; for (const b of td.values()) if (b.until > t + EPS && b.p[prop]) s += b.p[prop]; return s; }
    const passives = () => {
      const acc = {};
      for (const s of skills) if (s.stats && rankOf(s) > 0) { const r = s.stats(ctx, rankOf(s)); for (const k in r) acc[k] = (acc[k] || 0) + r[k]; }
      if (def.stats) { const r = def.stats(ctx); for (const k in r) acc[k] = (acc[k] || 0) + r[k]; }
      return acc;
    };
    let inPass = false;
    function pas(prop) {
      if (inPass) return 0;
      inPass = true; let r; try { r = passives(); } finally { inPass = false; }
      return r[prop] || 0;
    }
    function str() { return H.str + H.strGain * (level - 1) + (bonus.str || 0) + sumBuff('str') + pas('str'); }
    function agi() { return H.agi + H.agiGain * (level - 1) + (bonus.agi || 0) + sumBuff('agi') + pas('agi'); }
    function int() { return H.int + H.intGain * (level - 1) + (bonus.int || 0) + sumBuff('int') + pas('int'); }
    function mp() { return int() + (bonus.mp || 0) + sumBuff('mp') + pas('mp'); }
    // ----- mana (opt-in: hero def.mana + param manaOn) -----
    const MN = def.mana && P.manaOn ? true : false;
    let mCur = 0, mT = 0, mInit = false, mSpent = 0, mWait = 0, mGain = 0;
    const mMax = () => P.manaBase + P.manaPerInt * int() + pas('maxMana');
    const mRegen = () => P.regenBase + P.regenPerInt * int();
    function manaNow() {
      if (!mInit) { mCur = mMax() * P.manaStart / 100; mT = 0; mInit = true; }
      const dt = t - mT;
      if (dt > 0) { mCur = Math.min(mMax(), mCur + mRegen() * dt); mT = t; }
      return mCur;
    }
    function costOf(s) { const v = cfg.skills[s.k] && cfg.skills[s.k].cost; return v == null ? 0 : pick(v, rankOf(s)); }
    function canAffordS(s) { return !MN || manaNow() + 1e-9 >= costOf(s); }
    function manaWait(s) { // seconds until s is affordable (Infinity if never)
      if (!MN) return 0; const need = costOf(s) - manaNow(); if (need <= 1e-9) return 0;
      if (costOf(s) > mMax() + 1e-9 || mRegen() <= 0) return Infinity; return need / mRegen();
    }
    function primaryBonus() {
      if (H.primary === 'str') return str();
      if (H.primary === 'agi') return agi();
      if (H.primary === 'int') return int();
      return (H.allMult || 0.45) * (str() + agi() + int());
    }
    function attackDamage() { return (H.dmgMin + H.dmgMax) / 2 + primaryBonus() + (bonus.dmg || 0) + sumBuff('dmg') + pas('dmg'); }
    function attackSpeed() { return Math.min(H.maxAS || 1200, Math.max(H.minAS || 20, H.baseAS + agi() + (bonus.as || 0) + sumBuff('as') + pas('as'))); }
    function cdMult() { return Math.max(0, 1 - (sumBuff('cdr') + pas('cdr')) / 100); }

    // Apply damage now. type: phys | mag | pure. src: breakdown key.
    function deal(amount, type, src, o) {
      o = o || {};
      if (t > W + EPS || !(amount > 0)) return 0;
      let m = 1;
      if (type === 'phys') m *= armorMult(opts.armor + sumDebuff('armor'));
      else if (type === 'mag') m *= Math.max(0, 1 - Math.max(-100, opts.mr - sumDebuff('mr')) / 100);
      m *= 1 + sumDebuff('amp') / 100;
      if (!o.unit) {
        let amp = sumBuff('outAmp') + pas('outAmp');
        if (type === 'mag') amp += sumBuff('magAmp') + pas('magAmp');
        if (ctx.targetSilenced()) amp += pas('silencedAmp');
        m *= 1 + amp / 100;
      }
      const d = amount * m;
      out.by[src] = (out.by[src] || 0) + d;
      out.total += d;
      out.events.push({ t, d, k: src });
      if (def.onDamage && !o.noHook) def.onDamage(ctx, d, src, o);
      return d;
    }

    // Hero attack (normal or skill-driven). Returns nothing; damage applied now.
    function heroAttack(src, o) {
      o = o || {};
      const hit = { src: src || 'attack', parts: [{ k: src || 'attack', v: attackDamage() + (o.bonus || 0) }], crits: [], extra: [], o };
      for (const s of skills) if (s.onAttack && rankOf(s) > 0) s.onAttack(ctx, rankOf(s), hit);
      // buff crits
      for (const b of hb.values()) if (b.until > t + EPS && b.p.crit) hit.crits.push(b.p.crit);
      let base = 0; for (const p of hit.parts) base += p.v;
      // expected crit multiplier (highest crit that procs wins)
      const crits = hit.crits.slice().sort((a, b) => b.mult - a.mult);
      let em = 0, miss = 1, critSrc = null;
      for (const c of crits) { em += miss * c.chance * c.mult; miss *= 1 - c.chance; if (!critSrc && c.chance > 0) critSrc = c.src; }
      em += miss * 1;
      const pm = armorMult(opts.armor + sumDebuff('armor'));
      for (const p of hit.parts) deal(p.v, 'phys', p.k, { attack: true, noHook: true });
      if (em > 1) deal(base * (em - 1), 'phys', critSrc || hit.src, { attack: true, noHook: true });
      for (const e of hit.extra) deal(e.v, e.type, e.k, { attack: true });
      out.attacks++;
      for (const s of skills) if (s.onHit && rankOf(s) > 0) s.onHit(ctx, rankOf(s), hit);
      if (def.onHit) def.onHit(ctx, hit);
      void pm;
    }

    // Recurring unit attacks from `start` while time < `until`.
    function unitAttacks(u) {
      const step = () => {
        if (t >= u.until - EPS) return;
        const dmg = typeof u.dmg === 'function' ? u.dmg() : u.dmg;
        deal(dmg * (u.count || 1), u.type || 'phys', u.src, { unit: true });
        if (u.onHit) u.onHit();
        const interval = typeof u.interval === 'function' ? u.interval() : u.interval;
        ctx.at(t + interval, step);
      };
      ctx.at(u.start + (u.first || 0), step);
    }

    function runEvents(upto) {
      for (;;) {
        const e = heap.peek();
        if (!e || e.time > upto + EPS) break;
        heap.pop();
        const keep = t; t = e.time; e.fn(); t = Math.max(keep, t);
      }
    }

    // ----- abilities: readiness, charges, casting -----
    for (const s of skills) {
      const r = rankOf(s);
      if (r > 0 && s.charges) { const mx = pick(vals(s.k)[s.charges.max] ?? s.charges.max, r); charges[s.k] = { n: mx, max: mx, next: Infinity }; }
      if (s.init && r > 0) s.init(ctx, r);
    }
    if (def.init) def.init(ctx);

    function isReady(s) {
      const r = rankOf(s);
      if (r <= 0 || !s.cast) return false;
      if (charges[s.k]) { if (charges[s.k].n <= 0) return false; }
      if ((cd[s.k] || 0) > t + EPS) return false;
      if (!canAffordS(s)) return false;
      if (t < silenceUntil - EPS && !s.ignoreSilence) return false;
      if (s.when && !s.when(ctx, r)) return false;
      return true;
    }
    function nextReadyTime() {
      let n = Infinity;
      for (const s of skills) {
        if (rankOf(s) <= 0 || !s.cast) continue;
        let rt = cd[s.k] || 0;
        if (charges[s.k] && charges[s.k].n <= 0) rt = Math.max(rt, charges[s.k].next);
        if (rt > t + EPS) n = Math.min(n, rt);
        else if (MN && !canAffordS(s)) { const w = manaWait(s); if (isFinite(w)) n = Math.min(n, t + w + 1e-6); }
      }
      if (silenceUntil > t + EPS) n = Math.min(n, silenceUntil);
      if (busyUntil > t + EPS) n = Math.min(n, busyUntil);
      if (disarmUntil > t + EPS) n = Math.min(n, disarmUntil);
      const e = heap.peek(); if (e) n = Math.min(n, Math.max(e.time, t + 1e-6));
      return n;
    }
    function startCooldown(s, r) {
      let c = typeof s.cd === 'function' ? s.cd(ctx, r) : pick(vals(s.k)[s.cd || 'cd'], r);
      if (c == null) c = 0;
      if (!s.noCdr) c *= cdMult();
      if (def.cooldownOverride) { const o = def.cooldownOverride(ctx, s, c); if (o != null) c = o; }
      if (charges[s.k]) {
        const ch = charges[s.k];
        const restore = pick(vals(s.k)[s.charges.restore] ?? s.charges.restore, r) * (s.noCdr ? 1 : cdMult());
        ch.n -= 1;
        if (ch.next === Infinity) ch.next = t + restore;
        const tick = () => {
          if (ch.n < ch.max && t + EPS >= ch.next) { ch.n++; ch.next = ch.n < ch.max ? t + restore : Infinity; if (ch.next !== Infinity) ctx.at(ch.next, tick); }
        };
        ctx.at(ch.next, tick);
        cd[s.k] = t + (c || 0);
      } else cd[s.k] = t + c;
    }

    const order = (def.castOrder || skills.map(s => s.k)).map(k => skills.find(s => s.k === k)).filter(Boolean);
    noAttack = !!def.noAttack;
    let guard = 0;
    while (guard++ < 200000) {
      runEvents(t);
      if (t >= W - EPS) break;
      if (t < busyUntil - EPS) { t = Math.min(busyUntil, nextReadyTime()); continue; }
      let casted = false;
      for (const s of order) {
        if (isReady(s)) {
          const r = rankOf(s);
          const cp = typeof s.cp === 'function' ? s.cp(ctx, r) : (typeof s.cp === 'string' ? pick(vals(s.k)[s.cp], r) : (s.cp || 0));
          if (cp > 0) { const end = t + cp; runEvents(end); t = end; }
          startCooldown(s, r);
          if (MN) { manaNow(); const cs = costOf(s); mCur -= cs; mSpent += cs; }
          out.casts.push({ t, a: s.key || s.k.toUpperCase(), k: s.k });
          s.cast(ctx, r);
          casted = true;
          break;
        }
      }
      if (casted) continue;
      const filler = def.filler && def.filler(ctx);
      if (filler) { // hero performs a non-attack action (e.g. songs) instead of attacking
        if (t >= fillerReady - EPS) fillerReady = filler(t);
        t = Math.max(Math.min(fillerReady, nextReadyTime()), t + 1e-6);
        continue;
      }
      if (noAttack || t < disarmUntil - EPS) { t = Math.max(nextReadyTime(), t + 1e-6); if (!isFinite(t)) break; continue; }
      const Sx = Math.max(t, atkReady);
      const nd = nextReadyTime();
      if (nd < Sx - EPS) { t = nd; continue; }
      if (Sx > t + EPS) { t = Sx; continue; } // re-check casts at attack start
      const asf = attackSpeed() / 100;
      const land = t + H.attackPoint / asf;
      atkReady = t + H.bat / asf;
      runEvents(land); t = land;
      if (t <= W + EPS) heroAttack('attack');
    }
    runEvents(W);
    out.dps = out.total / W;
    out.stats = { str: str(), agi: agi(), int: int(), mp: mp(), attackDamage: attackDamage(), as: attackSpeed() };
    if (MN) out.mana = { on: true, max: mMax(), regen: mRegen(), start: mMax() * P.manaStart / 100, spent: mSpent, gained: mGain, left: manaNow() };
    // stats at rest (t = 0 state without temporary buffs) for display
    return out;
  }

  function baseStats(def, cfg, level, ranks, opts) {
    const r = simulate(def, cfg, level, ranks, Object.assign({}, opts, { window: 0.001 }));
    return r.stats;
  }

  function best(def, cfg, level, ranks, opts) {
    const policies = def.policies || ['default'];

    }

  }

  function dot(c, src, type, dur, interval, amountFn, firstAtZero) {
    const n = Math.round(dur / interval);
    const t0 = c.t;
    for (let i = firstAtZero ? 0 : 1; i <= n - (firstAtZero ? 1 : 0); i++) c.at(t0 + i * interval, () => c.deal(amountFn(), type, src));
  }
  function stat(id, extra) {
    const s = Object.assign({}, STATS[id], extra || {});
    s.primary = { DOTA_ATTRIBUTE_STRENGTH: 'str', DOTA_ATTRIBUTE_AGILITY: 'agi', DOTA_ATTRIBUTE_INTELLECT: 'int', DOTA_ATTRIBUTE_ALL: 'all' }[s.primary] || s.primary;
    return s;
  }

  const DUR = L('Длительность', 'duration');

  function slashSeries(c, src, dur, delay, extra) {
    const d = delay / (c.attackSpeed() / 100);
    const start = c.t; let i = 0, tt = start; const times = [];
    for (;;) { times.push(tt); if (tt - start < dur) { i++; tt = start + i * d; } else break; }
    const end = Math.max(start + dur, times[times.length - 1]);
    c.disarm(end); c.S.slashEnd = end;
    for (const x of times) c.at(x, () => { c.heroAttack(src); if (extra > 0) c.deal(extra, 'phys', src); });
  }

      c.at(c.t + 1, step);
    };
    c.at(c.t + 1, step);
  }

  st.sel = topIds(5);
  const colorOf = id => { const i = st.sel.indexOf(id); return i < 0 ? null : COLORS[i % COLORS.length]; };
  function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }

  function drawLines() {
    const rows = DATA.filter(h => !(st.noChen && h.id === 'chen'));
    const w = 720, h = 380, pl = 52, pr = 148, pt = 14, pb = 28;
    const ymax = niceMax(Math.max(...rows.map(r => Math.max(...r[st.mode]))));
    const X = L => pl + (L - 1) / 29 * (w - pl - pr), Y = v => pt + (1 - v / ymax) * (h - pt - pb);
    let g = '';
    for (let i = 0; i <= 5; i++) { const v = ymax * i / 5; g += `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pl - 6}" y="${Y(v) + 3.5}" text-anchor="end">${fmt(v)}</text>`; }
    for (const L of [1, 6, 12, 18, 24, 30]) g += `<text x="${X(L)}" y="${h - 8}" text-anchor="middle">${L}</text>`;
    g += `<line x1="${X(st.L)}" x2="${X(st.L)}" y1="${pt}" y2="${h - pb}" stroke="var(--accent)" stroke-dasharray="3 3"/>`;
    const path = r => r[st.mode].map((v, i) => `${i ? 'L' : 'M'}${X(i + 1).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    let gray = '', col = '', labels = [];
    for (const r of rows) {
      const c = colorOf(r.id);
      if (!c) gray += `<path d="${path(r)}" fill="none" stroke="var(--ink-3)" stroke-width="1.2" opacity=".35" data-id="${r.id}" class="ln"/>`;
      else { col += `<path d="${path(r)}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" data-id="${r.id}" class="ln"/><circle cx="${X(30)}" cy="${Y(r[st.mode][29])}" r="3.5" fill="${c}" stroke="var(--panel)" stroke-width="1.5"/>`; labels.push({ y: Y(r[st.mode][29]), name: r.name, c, v: r[st.mode][29] }); }
    }
    labels.sort((a, b) => a.y - b.y);
    const gap = 16, top = pt + 10, bottom = h - pb - 4;
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < gap) labels[i].y = labels[i - 1].y + gap;
    if (labels.length && labels[labels.length - 1].y > bottom) {
      const shift = labels[labels.length - 1].y - bottom;
      for (const l of labels) l.y -= shift;
    }
    if (labels.length && labels[0].y < top) {
      const shift = top - labels[0].y;
      for (const l of labels) l.y = Math.min(bottom, l.y + shift);
    }
    const lab = labels.map(l => `<text x="${X(30) + 8}" y="${l.y + 4}" style="fill:var(--ink-2);font-size:11px">${l.name}</text>`).join('');
    $('lines').innerHTML = `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" style="min-width:520px" role="img" aria-label="ДПС героев по уровню">${g}${gray}${col}${lab}<line id="xh" x1="0" x2="0" y1="${pt}" y2="${h - pb}" stroke="var(--ink-3)" visibility="hidden"/><rect id="hit" x="${pl}" y="${pt}" width="${w - pl - pr}" height="${h - pt - pb}" fill="transparent"/></svg></div><div class="tip" id="tip" hidden></div>`;
    const svg = $('lines').querySelector('svg'), tip = $('tip'), xh = svg.querySelector('#xh');
    svg.addEventListener('pointermove', e => {
      const rect = svg.getBoundingClientRect(), box = $('lines').getBoundingClientRect();
      const sx = (e.clientX - rect.left) / rect.width * w;
      const L = Math.max(1, Math.min(30, Math.round((sx - pl) / (w - pl - pr) * 29 + 1)));
      xh.setAttribute('x1', X(L)); xh.setAttribute('x2', X(L)); xh.setAttribute('visibility', 'visible');
      const list = rows.slice().sort((a, b) => b[st.mode][L - 1] - a[st.mode][L - 1]);
      tip.hidden = false;
      tip.innerHTML = `<b>Уровень ${L}</b><br>` + list.map(r => { const c = colorOf(r.id); return `<span style="color:${c ? 'var(--ink)' : 'var(--ink-3)'}">${c ? `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c};margin-right:5px"></i>` : ''}${r.name}: <b>${fmt(r[st.mode][L - 1])}</b></span>`; }).join('<br>');
      const px = rect.left - box.left + X(L) / w * rect.width;
      tip.style.left = (px > box.width * 0.55 ? px - tip.offsetWidth - 12 : px + 12) + 'px';
      tip.style.top = '6px';
    });
    svg.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
  }

  function drawRank() {
    $('rankTitle').textContent = `Рейтинг на ${st.L} уровне`;
    const rows = DATA.filter(h => !(st.noChen && h.id === 'chen')).slice().sort((a, b) => b[st.mode][st.L - 1] - a[st.mode][st.L - 1]);
    const mx = rows[0][st.mode][st.L - 1] || 1;
    $('rank').innerHTML = rows.map((r, i) => {
      const v = r[st.mode][st.L - 1], c = colorOf(r.id);
      const build = r[st.mode === 'fight' ? 'fightBuild' : 'burstBuild'][st.L - 1];
      const link = LINKS[r.id] ? `<a href="${LINKS[r.id]}">${r.name}</a>` : r.name;
      return `<div class="rk ${c ? 'sel' : ''}" data-id="${r.id}" style="${c ? '--c:' + c : ''}"><span class="pos">${i + 1}</span><span class="nm">${link}</span><span class="trk"><span style="width:${(v / mx * 100).toFixed(1)}%"></span></span><span class="vl">${fmt(v)}</span><span class="bd">прокачка ${build}</span></div>`;
    }).join('');
    $('rank').querySelectorAll('.rk').forEach(el => el.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      const id = el.dataset.id, i = st.sel.indexOf(id);
      if (i >= 0) st.sel.splice(i, 1); else { if (st.sel.length >= COLORS.length) st.sel.shift(); st.sel.push(id); }
      draw();
    }));
  }

  function drawTable() {
    const Ls = Array.from({ length: 30 }, (_, i) => i + 1);
    $('th').innerHTML = `<th>Герой</th>` + Ls.map(L => `<th>${L}</th>`).join('');
    const rows = DATA.slice().sort((a, b) => b[st.mode][st.L - 1] - a[st.mode][st.L - 1]);
    $('tbl').querySelector('tbody').innerHTML = rows.map(r => `<tr style="cursor:default"><td>${LINKS[r.id] ? `<a href="${LINKS[r.id]}">${r.name}</a>` : r.name}</td>${r[st.mode].map((v, i) => `<td class="num ${i + 1 === st.L ? 'strong' : ''}">${fmt(v)}</td>`).join('')}</tr>`).join('');
  }
  function draw() { drawLines(); drawRank(); drawTable(); }
  const setMode = m => { st.mode = m; $('mFight').setAttribute('aria-pressed', m === 'fight'); $('mBurst').setAttribute('aria-pressed', m === 'burst'); draw(); };
  $('mFight').addEventListener('click', () => setMode('fight'));
  $('mBurst').addEventListener('click', () => setMode('burst'));
  $('lvl').addEventListener('input', e => { st.L = +e.target.value; $('lvlOut').textContent = st.L; draw(); });
  $('noChen').addEventListener('change', e => { st.noChen = e.target.checked; st.sel = st.sel.filter(id => !(st.noChen && id === 'chen')); draw(); });
  draw();
}

function mountHero(heroId) {
  const E = window.TrinityDPS;
  const def = window.TrinityHeroes.HEROES.find(h => h.id === heroId);
  const SNAP = E.defaultCfg(def);
  let KV0 = E.defaultCfg(def);
  let cfg = E.defaultCfg(def);
  const STORE = 'trinity-dps-kv-' + def.id;
  try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && s.hero && s.skills) cfg = s; } catch (e) {}
  try { const s = JSON.parse(localStorage.getItem(STORE + '-base') || 'null'); if (s && s.hero && s.skills) KV0 = s; } catch (e) {}
  const $ = id => document.getElementById(id);
  const fmt = v => Math.round(v).toLocaleString('ru-RU');
  const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('ru-RU');
  const learn = E.learnable(def);
  const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)'];
  const SOURCES = [['attack', 'Атаки']].concat(def.skills.filter(s => !['det', 'act', 'b', 'gs'].includes(s.k)).map(s => [s.k, s.name]));
  const colorOf = k => COLORS[Math.max(0, SOURCES.findIndex(s => s[0] === k)) % COLORS.length];
  const nameOf = k => (SOURCES.find(s => s[0] === k) || [k, k])[1];
  const hasScepter = !!(def.scepterLabel || def.skills.some(s => s.scepter));

  const state = { level: 18, ranks: {}, optBy: 'fight', params: {} };
  learn.forEach(s => state.ranks[s.k] = s.max);
  (def.params || []).forEach(p => state.params[p.id] = p.def);

  $('lede').textContent = `Урон в секунду по одной цели: ${def.ru} бьёт без перерыва и прожимает способности сразу, как они откатываются. Числа взяты из KV и Lua Trinity от 8 октября 2026. Значения способностей можно менять внизу страницы, всё пересчитывается сразу.`;
  $('scepterWrap').hidden = !hasScepter;
  if (def.scepterLabel) $('scepterLabel').textContent = def.scepterLabel;
  $('notes').innerHTML = (def.notes || []).concat([
    `Статы ${def.ru} ванильные: урон ${def.hero.dmgMin}–${def.hero.dmgMax}, BAT ${def.hero.bat}, база скорости атаки ${def.hero.baseAS}, точка атаки ${def.hero.attackPoint}. Основной атрибут даёт урон атаки, ловкость — скорость атаки.`,
    'Физический урон режется бронёй по формуле Dota, магический — маг. сопротивлением, чистый — ничем. Сила магии = интеллект + бонусы.',
    'Мана и таланты не учитываются (таланты в Trinity пока заглушки). Касты — сразу после попадания атаки, полёт снарядов дальних атак не учитывается.'
  ]).map(n => `<li>${n}</li>`).join('');

  // ---------- hero params ----------
  function renderParams() {
    const box = $('params'); box.innerHTML = '';
    const ps = def.params || [];
    if (def.variants) {
      const f = document.createElement('div'); f.className = 'field';
      f.innerHTML = `<label for="variant">Между заклинаниями</label><select id="variant"><option value="auto">Авто (лучший режим)</option>${def.variants.map(v => `<option value="${v.id}">${v.label}</option>`).join('')}</select>`;
      box.appendChild(f);
      f.querySelector('select').value = state.variant || 'auto';
      f.querySelector('select').addEventListener('change', e => { state.variant = e.target.value; update(true); });
    }
    for (const p of ps) {
      const id = 'p_' + p.id;
      const el = document.createElement('div');
      if (p.type === 'bool') {
        el.innerHTML = `<label class="toggle"><input type="checkbox" id="${id}" ${state.params[p.id] ? 'checked' : ''}> ${p.label}</label>`;
        el.querySelector('input').addEventListener('change', e => { state.params[p.id] = e.target.checked ? 1 : 0; update(true); });
      } else if (p.type === 'select') {
        el.className = 'field';
        el.innerHTML = `<label for="${id}">${p.label}</label><select id="${id}">${p.options.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>`;
        el.querySelector('select').value = state.params[p.id];
        el.querySelector('select').addEventListener('change', e => { state.params[p.id] = e.target.value; update(true); });
      } else {
        el.className = 'field';
        el.innerHTML = `<div class="lvl"><label for="${id}">${p.label}</label><span class="num" id="${id}_v">${state.params[p.id]}</span></div><input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${state.params[p.id]}">`;
        const inp = el.querySelector('input');
        inp.addEventListener('input', e => { state.params[p.id] = +e.target.value; $(id + '_v').textContent = e.target.value; update(); });
        inp.addEventListener('change', () => update(true));
      }
      box.appendChild(el);
    }
    $('heroOpts').hidden = !ps.length && !def.variants;
  }

  function opts() {
    const n = id => { const v = parseFloat($(id).value); return isFinite(v) ? v : 0; };
    return {
      armor: n('armor'), mr: Math.min(100, n('mr')), scepter: hasScepter && $('scepter').checked,
      bonus: { dmg: n('bDmg'), as: n('bAs'), str: n('bStr'), agi: n('bAgi'), int: n('bInt'), mp: n('bMp') },
      params: Object.assign({}, state.params), variant: state.variant || 'auto',
      burstWindow: Math.max(1, n('wBurst') || 5), fightWindow: Math.max(5, n('wFight') || 60),
    };
  }
  const sum = () => learn.reduce((a, s) => a + state.ranks[s.k], 0);
  function clampRanks() {
    const L = state.level;
    for (const s of learn) state.ranks[s.k] = Math.min(state.ranks[s.k], E.maxRank(L, s));
    let guard = 0;
    while (sum() > L && guard++ < 200) {
      const cand = learn.filter(s => !s.ult && state.ranks[s.k] > 0).sort((a, b) => state.ranks[b.k] - state.ranks[a.k])[0] || learn.find(s => state.ranks[s.k] > 0);
      if (!cand) break; state.ranks[cand.k]--;
    }
  }
  function renderSkills() {
    const box = $('skills'); box.innerHTML = '';
    const L = state.level;
    for (const s of learn) {
      const allowed = E.maxRank(L, s);
      const el = document.createElement('div'); el.className = 'skill';
      el.innerHTML = `<span class="key">${s.key}</span><span class="sname">${s.name}<small>${s.sub || ''}</small></span>`;
      const pips = document.createElement('div'); pips.className = 'pips';
      for (let r = 1; r <= s.max; r++) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'pip' + (state.ranks[s.k] >= r ? ' on' : '');
        b.setAttribute('aria-label', `${s.name}: уровень ${r}`);
        const need = state.ranks[s.k] >= r ? 0 : r - state.ranks[s.k];
        b.disabled = r > allowed || (need > 0 && sum() + need > L);
        b.addEventListener('click', () => { state.ranks[s.k] = state.ranks[s.k] === r ? r - 1 : r; update(); });
        pips.appendChild(b);
      }
      el.appendChild(pips); box.appendChild(el);
    }
    $('pointsOut').innerHTML = `очков: <b>${sum()}</b> из <b>${L}</b>`;
  }

  function renderBar(barId, legId, res, label) {
    const total = res.total || 1;
    const keys = SOURCES.map(s => s[0]).filter(k => (res.by[k] || 0) > 0);
    $(barId).innerHTML = keys.map(k => `<span style="width:${(res.by[k] / total * 100).toFixed(2)}%;background:${colorOf(k)}" title="${nameOf(k)}"></span>`).join('');
    $(legId).innerHTML = `<span style="color:var(--ink-3)">${label}</span>` + keys.map(k => `<span><i style="background:${colorOf(k)}"></i>${nameOf(k)} <b>${fmt(res.by[k] / res.window)}</b> <span style="color:var(--ink-3)">${Math.round(res.by[k] / total * 100)}%</span></span>`).join('');
  }
  const sim = (w, ranks, o) => E.best(def, cfg, state.level, ranks, Object.assign({}, o, { window: w }));

  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
  function fmtK(v) { return v >= 10000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0).replace('.', ',') + 'к' : fmt(v); }

  function renderTimeline(res) {
    const W = res.window, box = $('timeline');
    const ev = res.events.slice().sort((a, b) => a.t - b.t);
    const pts = [[0, 0]]; let acc = 0;
    for (const e of ev) { acc += e.d; pts.push([e.t, acc]); }
    pts.push([W, acc]);
    // дорожки способностей: по одной на клавишу, касты — короткие засечки
    const laneOf = c => (c.k === 'det' || c.k === 'act' || c.k === 'b') ? 'r' : (c.k || '?');
    const inWin = res.casts.filter(c => c.t <= W);
    const order = def.skills.map(s => s.k);
    const lanes = order.filter(k => inWin.some(c => laneOf(c) === k));
    if (inWin.some(c => laneOf(c) === '?')) lanes.push('?');
    const LH = 16;
    const w = 640, pl = 52, pr = 12, pt = 10, ph = 170, ybot = pt + ph, lanesH = lanes.length * LH, h = ybot + (lanes.length ? 8 : 0) + lanesH + 24;
    const ymax = niceMax(acc);
    const X = t => pl + (t / W) * (w - pl - pr), Y = v => pt + (1 - v / ymax) * ph;
    const yLane0 = ybot + 8, yAxis = yLane0 + lanesH;
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; g += `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${pl - 6}" y="${Y(v) + 3.5}" text-anchor="end">${fmtK(v)}</text>`; }
    const step = W <= 10 ? 1 : W <= 30 ? 5 : W <= 90 ? 10 : 30;
    for (let t = 0; t <= W + 1e-9; t += step) g += `<line x1="${X(t)}" x2="${X(t)}" y1="${pt}" y2="${yAxis}" stroke="var(--grid)" stroke-width="1" opacity=".5"/><text x="${X(t)}" y="${yAxis + 16}" text-anchor="middle">${t}с</text>`;
    let d = `M${X(0)},${Y(0)}`, prev = 0;
    for (const [t, v] of pts) { d += ` L${X(t).toFixed(1)},${Y(prev).toFixed(1)} L${X(t).toFixed(1)},${Y(v).toFixed(1)}`; prev = v; }
    const area = d + ` L${X(W)},${Y(0)} Z`;
    const skillName = {}; def.skills.forEach(s => { skillName[s.k] = s; });
    let casts = '';
    lanes.forEach((k, i) => {
      const y0 = yLane0 + i * LH;
      const col = k === '?' ? 'var(--ink-3)' : colorOf(k);
      const sk = skillName[k];
      casts += `<rect x="${pl}" y="${y0}" width="${w - pl - pr}" height="${LH - 2}" rx="3" fill="var(--grid)" opacity=".35"/>`;
      casts += `<text x="${pl - 6}" y="${y0 + LH / 2 + 3}" text-anchor="end" style="fill:var(--ink-2)">${sk ? sk.key : '·'}</text>`;
      for (const c of inWin) if (laneOf(c) === k) casts += `<rect x="${(X(c.t) - 1.5).toFixed(1)}" y="${y0 + 1}" width="3" height="${LH - 4}" rx="1.5" fill="${col}"/>`;
    });
    box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Накопленный урон по времени и касты способностей">${g}<path d="${area}" fill="var(--s1)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(W)}" cy="${Y(acc)}" r="4" fill="var(--s1)" stroke="var(--panel)" stroke-width="2"/>${casts}<line id="xh" x1="0" x2="0" y1="${pt}" y2="${yAxis}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/><rect x="${pl}" y="${pt}" width="${w - pl - pr}" height="${yAxis - pt}" fill="transparent"/></svg><div class="tip" id="tlTip" hidden></div>`;
    const svg = box.querySelector('svg'), tip = $('tlTip'), xh = svg.querySelector('#xh');
    svg.addEventListener('pointermove', ev2 => {
      const rect = svg.getBoundingClientRect();
      const sx = (ev2.clientX - rect.left) / rect.width * w;
      const t = Math.max(0, Math.min(W, (sx - pl) / (w - pl - pr) * W));
      let v = 0; for (const [pt_, vv] of pts) { if (pt_ <= t) v = vv; else break; }
      const near = inWin.filter(c => Math.abs(c.t - t) <= W / 100).map(c => (skillName[laneOf(c)] ? skillName[laneOf(c)].name : c.a)).filter((x, i, arr) => arr.indexOf(x) === i);
      xh.setAttribute('x1', X(t)); xh.setAttribute('x2', X(t)); xh.setAttribute('visibility', 'visible');
      tip.hidden = false;
      tip.innerHTML = `<b>${t.toFixed(1)} с</b><br>урон: <b>${fmt(v)}</b><br>средний ДПС: <b>${t > 0.05 ? fmt(v / t) : '—'}</b>` + (near.length ? `<br>каст: <b>${near.join(', ')}</b>` : '');
      const px = (X(t) / w) * rect.width;
      tip.style.left = Math.max(0, Math.min(px + 12, rect.width - tip.offsetWidth - 4)) + 'px';
      tip.style.top = '8px';
    });
    svg.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
  }

  function renderCalc() {
    const o = opts();
    const burst = sim(o.burstWindow, state.ranks, o);
    const fight = sim(o.fightWindow, state.ranks, o);
    $('burstLabel').textContent = `Бёрст, первые ${o.burstWindow} сек`;
    $('fightLabel').textContent = `Бой, средний за ${o.fightWindow} сек`;
    $('burstDps').textContent = fmt(burst.dps);
    $('fightDps').textContent = fmt(fight.dps);
    $('burstTotal').textContent = `${fmt(burst.total)} урона за ${o.burstWindow} с`;
    $('fightTotal').textContent = `${fmt(fight.total)} урона за ${o.fightWindow} с` + (fight.variant ? ` · ${(def.variants.find(v => v.id === fight.variant) || {}).label || ''}` : '');
    const st = E.baseStats(def, cfg, state.level, state.ranks, o);
    const am = E.armorMult(o.armor);
    $('armorNote').textContent = `Броня ${o.armor} режет физический урон на ${Math.round((1 - am) * 100)}%.`;
    $('stats').innerHTML = [

      try { let d = h; for (const seg of path) d = await d.getDirectoryHandle(seg); await d.getFileHandle(KVFILE_NAME); return d; } catch (e) {}
    }
    return null;
  }
  let dirH = null;
  async function kvDir(forcePick) {
    if (typeof window.showDirectoryPicker !== 'function') { const e = new Error('nofs'); e.nofs = true; throw e; }
    let h = forcePick ? null : (dirH || await getDir());
    if (h) { let perm = await h.queryPermission({ mode: 'readwrite' }); if (perm !== 'granted') perm = await h.requestPermission({ mode: 'readwrite' }); if (perm !== 'granted') h = null; }
    if (!h) {
      try { h = await window.showDirectoryPicker({ id: 'trinity-kv', mode: 'readwrite' }); }
      catch (e) { if (e && e.name === 'AbortError') throw e; const x = new Error('nofs'); x.nofs = true; throw x; }
    }
    const ab = await abilitiesOf(h);
    if (!ab) throw new Error(`В папке «${h.name}» нет ${KVFILE_NAME}. Выберите D:\\Trinity\\Game\\scripts\\npc\\abilities (или папку Game).`);
    dirH = h; putDir(h);
    return ab;
  }
  const stamp = () => new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const kvStatus = (t, bad) => { $('kvStatus').textContent = t; $('kvStatus').classList.toggle('muted', !bad); $('kvStatus').style.color = bad ? 'var(--accent)' : ''; };
  const NOFS = 'Здесь браузер не даёт доступа к папкам. Откройте локальный файл trinity-balance.html в Chrome или Edge — там кнопки читают и пишут KV. Пока можно выбрать ' ;
  async function loadFromFolder(forcePick) {
    try {
      const ab = await kvDir(forcePick);
      const text = await (await (await ab.getFileHandle(KVFILE_NAME)).getFile()).text();
      const r = applyKvText(text);
      saveKv(); renderKv(); update(true);
      kvStatus(`${KVFILE_NAME} прочитан в ${stamp()} · ${r.got} значений из файла${r.miss.length ? ', не найдены: ' + r.miss.join(', ') : ''}`);
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      if (e && e.nofs) { kvStatus(NOFS + KVFILE_NAME + ' вручную — только чтение.', true); $('kvFile').click(); return; }
      kvStatus('Не удалось прочитать KV: ' + (e && e.message || e), true);
    }
  }
  $('kvFile').addEventListener('change', async () => {
    const f = $('kvFile').files[0]; if (!f) return;
    const r = applyKvText(await f.text()); $('kvFile').value = '';
    saveKv(); renderKv(); update(true);
    kvStatus(`${f.name} прочитан в ${stamp()} (только чтение) · ${r.got} значений${r.miss.length ? ', не найдены: ' + r.miss.join(', ') : ''}`);
  });
  function patchKvText(text) {
    const root = kvParse(text); const edits = new Map(); const skipped = [];
    for (const [title, fields] of KVF) for (const [p, , kv] of fields) {
      if (getP(KV0, p) == null || show(getP(KV0, p)) === show(getP(cfg, p))) continue;
      const b = bindOf(p); const tok = b && kvFind(root, b[1], b[2]);
      if (!tok) { skipped.push(`${title} · ${kv}`); continue; }
      const v = getP(cfg, p); const arr = Array.isArray(v) ? v : [v];
      const single = numsOf(tok.v).length === 1 && arr.every(x => x === arr[0]);
      edits.set(tok.s, { tok, p, out: single ? fmtNum(arr[0]) : arr.map(fmtNum).join(' ') });
    }
    if (!edits.size) return { out: null, edits, skipped };
    let out = text;
    for (const ed of [...edits.values()].sort((a, b) => b.tok.s - a.tok.s)) out = out.slice(0, ed.tok.s) + ed.out + out.slice(ed.tok.e);
    return { out, edits, skipped };
  }
  function commitEdits(edits) {
    for (const ed of edits.values()) { const v = getP(cfg, ed.p); setP(KV0, ed.p, Array.isArray(v) ? v.slice() : v); }
    saveKv(); renderKv();
  }
  const API = 'http://127.0.0.1:8080';
  let alive = true;
  async function fetchHeroKv() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    try {
      const res = await fetch(API + '/v1/balance/kv?hero=' + encodeURIComponent(def.id), { signal: ctrl.signal });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok !== true || typeof data.text !== 'string') throw new Error((data && data.error) || ('HTTP ' + res.status));
      return data;
    } finally { clearTimeout(timer); }
  }
  async function pullKv(allowPicker) {
    try {
      const data = await fetchHeroKv();
      if (!alive) return;
      const r = applyKvText(data.text);
      saveKv(); renderKv(); update(true);
      kvStatus(`${data.file || KVFILE_NAME} прочитан в ${stamp()} · ${r.got} значений из файла${r.miss.length ? ', не найдены: ' + r.miss.join(', ') : ''}`);
      return;
    } catch (e) {
      if (!alive) return;
      if (allowPicker) return loadFromFolder(false);
      kvStatus('Не удалось прочитать ' + KVFILE_NAME + ' (' + (e && e.name === 'AbortError' ? 'сервер не ответил' : (e && e.message || e)) + '). Показан снимок. Запустите server\\start-local.ps1 или выберите папку KV.', true);
    }
  }
  async function saveToFolder() {
    let ab;
    try { ab = await kvDir(false); } catch (e) {
      if (e && e.name === 'AbortError') return;
      if (e && e.nofs) { copyText(PATCH, 'Записать файл отсюда нельзя — патч скопирован'); kvStatus(NOFS.replace(' Пока можно выбрать ', '') , true); return; }
      kvStatus('Не удалось открыть папку: ' + (e && e.message || e), true); return;
    }
    try {
      const fh = await ab.getFileHandle(KVFILE_NAME);
      const text = await (await fh.getFile()).text();
      const patched = patchKvText(text);
      if (!patched.out) { kvStatus(patched.skipped.length ? 'Нечего записывать: изменённые поля есть только в модели (' + patched.skipped.join('; ') + ')' : 'Изменений нет'); return; }
      const w = await fh.createWritable(); await w.write(patched.out); await w.close();
      commitEdits(patched.edits);
      kvStatus(`Записано в ${KVFILE_NAME} в ${stamp()}: ${patched.edits.size} знач.${patched.skipped.length ? ' Не записано (нет в файле): ' + patched.skipped.join('; ') : ''}`);
    } catch (e) { kvStatus('Не удалось записать ' + KVFILE_NAME + ': ' + (e && e.message || e), true); }
  }
  async function saveChanges() {
    try {
      const data = await fetchHeroKv();
      if (!alive) return;
      const patched = patchKvText(data.text);
      if (!patched.out) { kvStatus(patched.skipped.length ? 'Нечего записывать: изменённые поля есть только в модели (' + patched.skipped.join('; ') + ')' : 'Изменений нет'); return; }
      const res = await fetch(API + '/v1/balance/kv', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hero: def.id, text: patched.out }) });
      const body = await res.json().catch(() => null);
      if (!alive) return;
      if (!res.ok || !body || body.ok !== true) throw new Error((body && body.error) || ('HTTP ' + res.status));
      commitEdits(patched.edits);
      kvStatus(`Записано в ${body.file || KVFILE_NAME} в ${stamp()}: ${patched.edits.size} знач.${patched.skipped.length ? ' Не записано (нет в файле): ' + patched.skipped.join('; ') : ''}`);
      return;
    } catch (e) {
      if (!alive) return;
      if (e && (e.name === 'AbortError' || e.name === 'TypeError')) return saveToFolder();
      kvStatus('Не удалось записать ' + KVFILE_NAME + ': ' + (e && e.message || e), true);
    }
  }
  $('resetKv').addEventListener('click', () => pullKv(true));
  $('kvPick').addEventListener('click', () => loadFromFolder(true));
  $('kvSnap').addEventListener('click', () => { cfg = E.defaultCfg(def); KV0 = E.defaultCfg(def); try { localStorage.removeItem(STORE); localStorage.removeItem(STORE + '-base'); } catch (e) {} renderKv(); update(true); kvStatus('Значения из снимка сборки (8 окт 2026).'); });
  const copyText = (txt, ok) => {
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('diff')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copyMsg').textContent = 'Выделено, нажмите Ctrl+C'; };
    try { navigator.clipboard.writeText(txt).then(() => { $('copyMsg').textContent = ok; }, fallback); } catch (e) { fallback(); }
  };
  $('saveToKv').addEventListener('click', () => saveChanges());
  $('copyDiff').addEventListener('click', () => {
    const txt = $('diff').textContent;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('diff')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copyMsg').textContent = 'Выделено, нажмите Ctrl+C'; };
    try { navigator.clipboard.writeText(txt).then(() => { $('copyMsg').textContent = 'Скопировано'; }, fallback); } catch (e) { fallback(); }
  });

  // ---------- wiring ----------
  function update(full) {
    $('levelOut').textContent = state.level;
    clampRanks(); renderSkills(); renderCalc();
    if (full) renderLadder(); else markRow();
  }
  $('level').addEventListener('input', e => { state.level = +e.target.value; update(); });
  $('bestFight').addEventListener('click', () => { state.ranks = Object.assign({}, E.optimize(def, cfg, state.level, opts(), 'fight').ranks); update(); });
  $('bestBurst').addEventListener('click', () => { state.ranks = Object.assign({}, E.optimize(def, cfg, state.level, opts(), 'burst').ranks); update(); });
  ['scepter', 'bDmg', 'bAs', 'bStr', 'bAgi', 'bInt', 'bMp', 'armor', 'mr', 'wBurst', 'wFight'].forEach(id => $(id).addEventListener('change', () => update(true)));
  const setOpt = by => { state.optBy = by; $('optFight').setAttribute('aria-pressed', by === 'fight'); $('optBurst').setAttribute('aria-pressed', by === 'burst'); renderLadder(); };
  $('optFight').addEventListener('click', () => setOpt('fight'));
  $('optBurst').addEventListener('click', () => setOpt('burst'));

  renderParams(); renderKv(); update(true);
  pullKv(false);
  return () => { alive = false; ladderJob += 1e6; };
}

(function () {
  const app = document.getElementById('app');
  let dispose = null, current = null;
  const ids = window.TrinityHeroes.HEROES.map(h => h.id);
  function show(id) {
    if (!ids.includes(id)) id = '';
    if (id === current && app.firstChild) return;
    current = id;
    if (dispose) { try { dispose(); } catch (e) {} dispose = null; }
    const tpl = document.getElementById(id ? 'tplHero' : 'tplSummary');
    app.innerHTML = '';
    app.appendChild(tpl.content.cloneNode(true));
    if (id) {
      const def = window.TrinityHeroes.HEROES.find(h => h.id === id);
      document.getElementById('heroTitle').textContent = def.title || ('ДПС ' + def.name);
      dispose = mountHero(id);
    } else mountSummary();
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    const id = a.getAttribute('href').slice(1);
    try { history.pushState(null, '', id ? '#' + id : location.pathname + location.search); } catch (err) {}
    show(id);
  });
  window.addEventListener('popstate', () => show(location.hash.slice(1)));
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
